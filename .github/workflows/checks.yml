# KDE Neon, since ubuntu-latest (24.04) still ships Plasma 5 and the QML checks need Plasma 6.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Floating tag, not a digest: KDE prunes old Neon images and pinned digests stopped resolving.
  kosmic:
    runs-on: ubuntu-latest
    container:
      image: invent-registry.kde.org/neon/docker-images/plasma:developer
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # kirigami-addons and kdeclarative stay out so an import of them fails here, not on users' machines.
      - name: dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs libxml2-utils \
            qt6-declarative qt6-declarative-dev \
            libplasma6 kf6-plasma5support kf6-ksvg kf6-kirigami

      # Without STRICT a tool missing from the image is skipped and the run stays green.
      - name: tools/test.sh
        run: tools/test.sh
        env:
          KOSMIC_TEST_STRICT: 1

  # Canary against KWin master: the plugins use KWin internals with no binary compatibility
  # (effect/effect.h:967), so breakage shows here weeks before rolling distributions.
  plugins:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: invent-registry.kde.org/neon/docker-images/plasma:unstable
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config extra-cmake-modules \
            kwin-dev qt6-base-dev qt6-base-private-dev kf6-kconfig-dev
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DINSTALL_PACKAGES=OFF
          cmake --build build --parallel

  nixos-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: nix build .#checks.x86_64-linux.module
        run: nix build .#checks.x86_64-linux.module -L --print-build-logs
