name: kosmic
arch: all
platform: linux
version: ${VERSION}
release: 1
section: kde
priority: optional
maintainer: Eduardo Ramon Resser <eduresser@gmail.com>
description: |
  COSMIC-style tiling for KDE Plasma 6.
  The KWin script, the two effects and the panel applet, plus kosmic-setup, which
  enables them for a user. The compiled components are not in this package: they
  have to be built against the exact KWin that runs them.
homepage: https://github.com/eduresser/kosmic
license: GPL-3.0-only

overrides:
  deb:
    depends:
      - kwin-wayland (>= 4:6)
      - systemd
      - plasma-workspace
  rpm:
    depends:
      - /usr/bin/kwin_wayland
      - /usr/bin/kwriteconfig6
      - /usr/bin/kreadconfig6
      - /usr/bin/busctl
      - /usr/bin/awk
  archlinux:
    depends:
      - kwin
      - kconfig
      - systemd
      - plasma-workspace
      - gawk

contents:
  - src: dist/stage/usr/share/kwin
    dst: /usr/share/kwin
    type: tree
  - src: dist/stage/usr/share/plasma
    dst: /usr/share/plasma
    type: tree
  - src: dist/stage/usr/share/icons
    dst: /usr/share/icons
    type: tree
  - src: dist/stage/usr/share/kosmic
    dst: /usr/share/kosmic
    type: tree
  - src: dist/stage/usr/bin/kosmic-setup
    dst: /usr/bin/kosmic-setup
    file_info: {mode: 0755}
  - src: dist/stage/usr/bin/kosmic-open
    dst: /usr/bin/kosmic-open
    file_info: {mode: 0755}
  - src: LICENSE
    dst: /usr/share/doc/kosmic/copyright
    file_info: {mode: 0644}
